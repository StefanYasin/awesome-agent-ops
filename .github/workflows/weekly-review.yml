name: Weekly link review

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-check every entry
        id: check
        continue-on-error: true
        run: python scripts/check_links.py --check-archived --json link-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open or update a failure issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let details = 'The weekly link check failed. See the workflow log for the full report.';
            try {
              const report = JSON.parse(fs.readFileSync('link-report.json', 'utf8'));
              const lines = report.failures.map((item) => `- ${item.url}: ${item.reason}`);
              details = `Checked ${report.total} entries at ${report.checked_at}.` + String.fromCharCode(10, 10) + lines.join(String.fromCharCode(10));
            } catch (error) {
              details = `The weekly link check failed before writing a report: ${error.message}`;
            }
            const title = 'Weekly link review failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: details,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: details,
              });
            }
      - name: Fail the workflow after filing the issue
        if: steps.check.outcome == 'failure'
        run: exit 1
